[package]
name = "rust-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rand = "0.10.3"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }
